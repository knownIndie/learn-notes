<script>
addEventListener('load', function () {
  var frame = null, site = null;
  try { frame = window.frameElement; site = parent.document.documentElement; } catch (e) {}
  if (!frame || !site) return;
  var sync = function () { var t = site.getAttribute('saved-theme'); if (t) document.documentElement.dataset.theme = t; };
  // body, not documentElement: inside an iframe the root is at least as tall as the frame itself.
  var fit = function () { frame.style.height = Math.ceil(document.body.getBoundingClientRect().height) + 'px'; };
  sync(); fit();
  new MutationObserver(sync).observe(site, { attributes: true, attributeFilter: ['saved-theme'] });
  new ResizeObserver(fit).observe(document.body);
});
</script>

<h2 class="sr-only">Stepper through the seven CORS lab buttons. Each step pairs the page code, the raw request, the server code, the raw response, then a hidden browser check and what the page shows.</h2>
<style>
.cl-pill{border:0.5px solid var(--border);border-radius:var(--radius);padding:4px 10px;font-size:13px;background:transparent;color:var(--text-primary);cursor:pointer}
.cl-pill.on{border-color:var(--border-stronger);font-weight:500}
.cl-card{border:0.5px solid var(--border);border-radius:12px;padding:10px;margin-top:10px}
.cl-h{font-size:13px;font-weight:500;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.cl-tag{font-size:11px;padding:1px 6px;border-radius:4px;font-weight:400}
.t-page{background:#EEEDFE;color:#3C3489}.t-api{background:#E1F5EE;color:#085041}.t-br{background:#FAEEDA;color:#633806}

.hl{background:var(--bg-success);color:var(--text-success)}
.cl-row{display:flex;justify-content:space-between;gap:8px}

</style>

const ROUTE_ME=`elif self.path == "/api/me":
    jar = SimpleCookie(self.headers.get("Cookie", ""))
    session = jar["session"].value if "session" in jar else None
    self.reply(200, {"cookie_seen": session is not None, "cookie": session}, [
        <hl>("Access-Control-Allow-Origin", "http://localhost:8000"),</hl>
        <hl>("Access-Control-Allow-Credentials", "true"),</hl>
    ])`;
const S=[

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const hl=s=>esc(s).replace(/&lt;hl&gt;/g,'<span class="hl">').replace(/&lt;\/hl&gt;/g,'</span>');
function line(t,src,h){return `<div class="cl-row"><pre class="cl">${h?'<span class="hl">'+esc(t)+'</span>':esc(t)||' '}</pre>${src?`<span class="src">${src}</span>`:''}</div>`}
let cur=0;
function render(){
 const s=S[cur];
 document.getElementById('pills').innerHTML=S.map((x,i)=>`<button class="cl-pill${i===cur?' on':''}" onclick="go(${i})">${i+1}. ${esc(x.n.replace(/^\d\. /,''))}</button>`).join('');
 let req=line(`GET ${s.path} HTTP/1.1`,'browser, from the fetch URL')+line('Host: localhost:9000','browser, from the fetch URL')+line('Origin: http://localhost:8000','browser adds it, no code writes it');
 req+=s.cookie?line('Cookie: session=demo123','browser, because of credentials: \'include\'',1):line('(no Cookie line)',s.js.includes('include')?'no cookie stored yet':'default credentials: no cookies');
 const resp=s.resp.map(([t,h])=>line(t,'',h)).join('');
 document.getElementById('stage').innerHTML=`
 <div class="cl-card"><div class="cl-h">1. Page code sends <span class="cl-tag t-page">index.html</span></div><pre class="cl">${hl(s.js)}</pre></div>
 <div class="cl-card"><div class="cl-h">2. Raw request <span class="cl-tag t-br">built by the browser</span></div>${req}</div>
 <div class="cl-card"><div class="cl-h">3. Server code answers <span class="cl-tag t-api">api.py</span></div><pre class="cl">${hl(s.py)}</pre></div>
 <div class="cl-card"><div class="cl-h">4. Raw response <span class="cl-tag t-api">sent by api.py</span></div>${resp}<div class="src" style="margin-top:4px">Server and Date lines trimmed</div></div>
 <div style="margin-top:10px"><button class="cl-pill" id="rv" onclick="reveal()">Show result</button></div>
 <div id="res" style="visibility:hidden">
 <div class="cl-card" style="border-color:${s.ok?'var(--border-success)':'var(--border-danger)'}"><div class="cl-h">5. Browser check <span class="cl-tag t-br">Chrome</span> <span style="color:${s.ok?'var(--text-success)':'var(--text-danger)'}">${s.ok?'pass':'blocked'}</span></div><div style="font-size:13px;line-height:1.6">${esc(s.check)}</div>${s.console?`<div class="src" style="margin-top:6px">DevTools Console:</div><pre class="cl" style="color:var(--text-danger)">${esc(s.console)}</pre>`:''}</div>
 <div class="cl-card"><div class="cl-h">6. What the page shows <span class="cl-tag t-page">index.html reads the reply</span></div><pre class="cl">${esc(s.page)}</pre><div style="font-size:13px;color:var(--text-secondary);margin-top:6px">${esc(s.why)}</div></div>
 </div>`;
}
function go(i){cur=i;render()}
function reveal(){document.getElementById('res').style.visibility='visible';document.getElementById('rv').style.display='none'}
render();
</script>
