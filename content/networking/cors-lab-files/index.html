<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CORS lab</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; }
  button { display: block; margin: 6px 0; padding: 6px 10px; }
  pre { background: #f3f3f3; padding: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<p>Page origin: http://localhost:8000</p>
<button onclick="run(() => fetch('http://localhost:9000/api/login', { credentials: 'include' }))">Log in (set cookie)</button>
<button onclick="run(() => fetch('http://localhost:9000/api/open'))">1. open (no CORS headers)</button>
<button onclick="run(() => fetch('http://localhost:9000/api/allow'))">2. allow (origin only)</button>
<button onclick="run(() => fetch('http://localhost:9000/api/allow-creds', { credentials: 'include' }))">3. allow with credentials</button>
<button onclick="run(() => fetch('http://localhost:9000/api/wildcard-creds', { credentials: 'include' }))">4. wildcard with credentials</button>
<button onclick="run(() => fetch('http://localhost:9000/api/me', { credentials: 'include' }))">5. who am I (cookie check)</button>
<pre id="out"></pre>
<script>
// Run one fetch and show the result, or the failure message.
async function run(call) {
  const out = document.getElementById('out');
  out.textContent = '';  // clear the previous result
  try {
    const res = await call();  // throws when the browser blocks the request or response
    const acao = res.headers.get('Access-Control-Allow-Origin') ?? 'null';  // 'null' when the header is missing or not readable
    const body = await res.text();  // the JSON body as sent
    out.textContent = `HTTP ${res.status}\nAccess-Control-Allow-Origin: ${acao}\n${body}`;
  } catch (err) {
    console.error(err);  // the real reason is in the console
    out.textContent = 'fetch failed: the browser blocked the request or the response. Check the browser console for the real reason.';
  }
}
</script>
</body>
</html>
