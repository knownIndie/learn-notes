<svg xmlns="http://www.w3.org/2000/svg" width="360" height="588" viewBox="0 0 360 588" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>Lost update: A and B both read stock 5, A writes 4, B writes 4 from its stale 5, so A's stock update is lost. Below: FOR UPDATE makes B wait, then read 0</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5e5d59"/></marker></defs>
<rect x="1" y="1" width="358" height="586" rx="12" fill="#faf9f5" stroke="#e3e1d9"/>
<text x="14" y="24" font-size="11" fill="#8a8984">time</text>
<text x="82" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#5e5d59">A</text>
<text x="180" y="24" text-anchor="middle" font-size="12" fill="#5e5d59">stock</text>
<text x="278" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#5e5d59">B</text>
<line x1="180" y1="30" x2="180" y2="264" stroke="#b4b2a9" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>

<g>
<rect x="14" y="36" width="136" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="82" y="60" text-anchor="middle" font-size="11" fill="#0C447C">t2: SELECT, gets 5</text>
<rect x="158" y="44" width="44" height="24" rx="6" fill="#ffffff" stroke="#5F5E5A"/>
<text x="180" y="61" text-anchor="middle" font-size="13" font-weight="700" fill="#2C2C2A">5</text>
</g>

<g>
<rect x="210" y="88" width="136" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="278" y="112" text-anchor="middle" font-size="11" fill="#633806">t3: SELECT, gets 5</text>
<rect x="158" y="96" width="44" height="24" rx="6" fill="#ffffff" stroke="#5F5E5A"/>
<text x="180" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#2C2C2A">5</text>
</g>

<g>
<rect x="14" y="140" width="136" height="40" rx="8" fill="#FCEBEB" stroke="#A32D2D"/>
<text x="82" y="164" text-anchor="middle" font-size="11" fill="#791F1F">t5: UPDATE 4, COMMIT</text>
<rect x="158" y="148" width="44" height="24" rx="6" fill="#ffffff" stroke="#5F5E5A"/>
<text x="180" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#2C2C2A">4</text>
</g>

<g>
<rect x="210" y="192" width="136" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="278" y="212" text-anchor="middle" font-size="11" fill="#633806">t6: UPDATE to 4</text>
<text x="278" y="228" text-anchor="middle" font-size="11" fill="#633806">(5 - 1, from stale 5)</text>
<text x="278" y="244" text-anchor="middle" font-size="11" fill="#633806">COMMIT</text>
<rect x="158" y="210" width="44" height="24" rx="6" fill="#ffffff" stroke="#5F5E5A"/>
<text x="180" y="227" text-anchor="middle" font-size="13" font-weight="700" fill="#2C2C2A">4</text>
</g>

<g>
<rect x="14" y="268" width="332" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D"/>
<text x="180" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#791F1F">Final stock: 4. It should be 3.</text>
<text x="180" y="309" text-anchor="middle" font-size="12" fill="#A32D2D">A's stock update is lost: B wrote from a stale 5.</text>
</g>

<rect x="14" y="342" width="332" height="210" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="180" y="364" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">FOR UPDATE: B waits, then reads 0</text>
<text x="180" y="382" text-anchor="middle" font-size="11" fill="#0F6E56">stock = 1; A holds the row lock</text>

<g>
<rect x="28" y="392" width="146" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="101" y="414" text-anchor="middle" font-size="11" fill="#0C447C">t2: locks row, gets 1</text>
<rect x="186" y="392" width="146" height="36" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="259" y="414" text-anchor="middle" font-size="11" fill="#633806">t3: waits for the lock</text>
</g>

<g>
<rect x="28" y="438" width="146" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="101" y="460" text-anchor="middle" font-size="11" fill="#0C447C">t5: UPDATE 0, COMMIT</text>
<rect x="186" y="438" width="146" height="36" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="259" y="460" text-anchor="middle" font-size="11" fill="#633806">t5: lock released</text>
</g>

<g>
<rect x="186" y="484" width="146" height="36" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="259" y="506" text-anchor="middle" font-size="11" fill="#27500A">t6: reads 0, sold out</text>
</g>

<text x="180" y="574" text-anchor="middle" font-size="11" fill="#8a8984">B waits for A's COMMIT, then sees 0.</text>
</svg>
