<svg xmlns="http://www.w3.org/2000/svg" width="360" height="400" viewBox="0 0 360 400" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>HTTP message: a request above a response, each made of start line, headers, blank line and body</title>
<rect x="1" y="1" width="358" height="398" rx="12" fill="#faf9f5" stroke="#e3e1d9"/>
<text x="16" y="34" font-size="13" font-weight="600" fill="#0C447C">Request (browser sends)</text>
<rect x="100" y="44" width="244" height="122" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<g font-size="11" fill="#5F5E5A">
<text x="16" y="64">start line</text>
<text x="16" y="98">headers</text>
<text x="16" y="130">blank line</text>
<text x="16" y="152">body</text>
</g>
<g font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#0C447C">
<text x="112" y="64" font-weight="700">GET /cart HTTP/1.1</text>
<text x="112" y="82">Host: api.com</text>
<text x="112" y="98">Origin: https://shop.com</text>
<text x="112" y="114">Accept: application/json</text>
<text x="112" y="152" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#185FA5">(none for GET)</text>
</g>
<text x="112" y="130" font-size="10.5" fill="#185FA5">(empty line: headers end here)</text>
<text x="16" y="200" font-size="13" font-weight="600" fill="#085041">Response (server sends)</text>
<rect x="100" y="210" width="244" height="122" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<g font-size="11" fill="#5F5E5A">
<text x="16" y="230">start line</text>
<text x="16" y="264">headers</text>
<text x="16" y="296">blank line</text>
<text x="16" y="318">body</text>
</g>
<g font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#085041">
<text x="112" y="230" font-weight="700">HTTP/1.1 200 OK</text>
<text x="112" y="248">Content-Type: application/json</text>
<text x="112" y="264">Content-Length: 15</text>
<text x="112" y="280">Cache-Control: no-store</text>
<text x="112" y="318">{"items": [42]}</text>
</g>
<text x="112" y="296" font-size="10.5" fill="#0F6E56">(empty line: body starts here)</text>
<text x="180" y="362" text-anchor="middle" font-size="12" fill="#5e5d59">Same four parts in both messages.</text>
<text x="180" y="380" text-anchor="middle" font-size="11" fill="#5e5d59">Content-Length tells the reader where the body ends.</text>
</svg>
