<svg xmlns="http://www.w3.org/2000/svg" width="360" height="630" viewBox="0 0 360 630" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>Rate limiting mental map</title>
<rect x="1" y="1" width="358" height="628" rx="12" fill="#faf9f5" stroke="#e3e1d9"/>
<rect x="108" y="16" width="144" height="40" rx="20" fill="#185FA5"/>
<text x="180" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Rate limiting</text>
<path d="M108 36 H36 V562" stroke="#b4b2a9" stroke-width="2" fill="none"/>
<g font-size="12">
<path d="M36 102 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="72" width="288" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="68" y="90" font-weight="600" fill="#3C3489">Why it exists</text>
<text x="68" y="107" fill="#534AB7">Brute force, spraying, stuffing, floods</text>
<text x="68" y="123" fill="#534AB7">Reply: 429 with Retry-After</text>
<path d="M36 176 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="146" width="288" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="68" y="164" font-weight="600" fill="#0C447C">Why Redis, not server memory</text>
<text x="68" y="181" fill="#185FA5">One counter shared by every server</text>
<text x="68" y="197" fill="#185FA5">Atomic step: no lost updates</text>
<path d="M36 250 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="220" width="288" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="68" y="238" font-weight="600" fill="#633806">Fixed window</text>
<text x="68" y="255" fill="#854F0B">One counter per clock block</text>
<text x="68" y="271" fill="#854F0B">Weakness: double burst at the edge</text>
<path d="M36 324 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="294" width="288" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="68" y="312" font-weight="600" fill="#085041">Sliding window</text>
<text x="68" y="329" fill="#0F6E56">Counts the last N seconds from now</text>
<text x="68" y="345" fill="#0F6E56">Log = exact; counter = approximate</text>
<path d="M36 398 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="368" width="288" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="68" y="386" font-weight="600" fill="#27500A">Token bucket</text>
<text x="68" y="403" fill="#3B6D11">Size = biggest burst</text>
<text x="68" y="419" fill="#3B6D11">Refill rate = steady average</text>
<path d="M36 480 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="442" width="288" height="76" rx="8" fill="#FCEBEB" stroke="#A32D2D"/>
<text x="68" y="460" font-weight="600" fill="#791F1F">Login endpoint</text>
<text x="68" y="477" fill="#A32D2D">5 per 30 min, sliding window</text>
<text x="68" y="493" fill="#A32D2D">Key = HMAC of normalised email</text>
<text x="68" y="509" fill="#A32D2D">Check the limit before the password</text>
<path d="M36 562 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="532" width="288" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="68" y="550" font-weight="600" fill="#2C2C2A">Gaps</text>
<text x="68" y="567" fill="#5F5E5A">Per-IP limit for password spraying</text>
<text x="68" y="583" fill="#5F5E5A">Fail closed or open when Redis is down</text>
</g>
<text x="180" y="618" text-anchor="middle" font-size="11" fill="#8a8984">A limit is a ceiling: at most N per window</text>
</svg>