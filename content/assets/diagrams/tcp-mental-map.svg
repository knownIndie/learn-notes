<svg xmlns="http://www.w3.org/2000/svg" width="360" height="540" viewBox="0 0 360 540" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>TCP mental map</title>
<rect x="1" y="1" width="358" height="538" rx="12" fill="#faf9f5" stroke="#e3e1d9"/>
<rect x="120" y="16" width="120" height="40" rx="20" fill="#185FA5"/>
<text x="180" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">TCP</text>
<path d="M120 36 H36 V472" stroke="#b4b2a9" stroke-width="2" fill="none"/>
<g font-size="12">
<path d="M36 102 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="72" width="288" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="68" y="90" font-weight="600" fill="#3C3489">Why it exists</text>
<text x="68" y="107" fill="#534AB7">IP sends packets with no promises</text>
<text x="68" y="123" fill="#534AB7">TCP turns them into one ordered stream</text>
<path d="M36 176 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="146" width="288" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="68" y="164" font-weight="600" fill="#0C447C">Three-way handshake</text>
<text x="68" y="181" fill="#185FA5">SYN, SYN-ACK, ACK: 1 round trip</text>
<text x="68" y="197" fill="#185FA5">both sides swap random start numbers</text>
<path d="M36 250 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="220" width="288" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="68" y="238" font-weight="600" fill="#085041">Reliability</text>
<text x="68" y="255" fill="#0F6E56">numbered bytes, ACKs, retransmission</text>
<text x="68" y="271" fill="#0F6E56">resend on timeout or 3 repeated ACKs</text>
<path d="M36 324 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="294" width="288" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="68" y="312" font-weight="600" fill="#633806">Flow vs congestion</text>
<text x="68" y="329" fill="#854F0B">flow: protects the receiver's buffer</text>
<text x="68" y="345" fill="#854F0B">congestion: protects the network</text>
<path d="M36 398 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="368" width="288" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="68" y="386" font-weight="600" fill="#2C2C2A">Close</text>
<text x="68" y="403" fill="#5F5E5A">FIN each way, RST aborts at once</text>
<text x="68" y="419" fill="#5F5E5A">closing side waits (TIME_WAIT)</text>
<path d="M36 472 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="442" width="288" height="60" rx="8" fill="#FCEBEB" stroke="#A32D2D"/>
<text x="68" y="460" font-weight="600" fill="#791F1F">TCP vs UDP</text>
<text x="68" y="477" fill="#A32D2D">TCP: reliable, ordered, set up first</text>
<text x="68" y="493" fill="#A32D2D">UDP: no setup, no retries</text>
</g>
<text x="180" y="528" text-anchor="middle" font-size="11" fill="#8a8984">TCP: reliable, ordered bytes over IP</text>
</svg>