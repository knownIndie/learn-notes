<svg xmlns="http://www.w3.org/2000/svg" width="360" height="530" viewBox="0 0 360 530" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>DNS lookup: the resolver asks root, then .com, then the authoritative server, and returns the IP to the browser</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5e5d59"/></marker></defs>
<rect x="1" y="1" width="358" height="528" rx="12" fill="#faf9f5" stroke="#e3e1d9"/>
<rect x="16" y="16" width="328" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="180" y="37" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Browser</text>
<text x="180" y="55" text-anchor="middle" font-size="11.5" fill="#185FA5">checks its own cache, then the OS cache</text>
<line x1="60" y1="66" x2="60" y2="100" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<text x="68" y="88" font-size="10.5" fill="#185FA5">1. shop.com?</text>
<line x1="200" y1="102" x2="200" y2="68" stroke="#5e5d59" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="208" y="88" font-size="10.5" fill="#3B6D11">8. 203.0.113.10</text>
<rect x="16" y="104" width="120" height="332" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="76" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">Recursive</text>
<text x="76" y="267" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">resolver</text>
<text x="76" y="288" text-anchor="middle" font-size="10.5" fill="#534AB7">your ISP or 8.8.8.8</text>
<text x="76" y="304" text-anchor="middle" font-size="10.5" fill="#534AB7">asks each server</text>
<text x="76" y="318" text-anchor="middle" font-size="10.5" fill="#534AB7">itself, in turn</text>
<g><rect x="226" y="110" width="118" height="70" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="285" y="134" text-anchor="middle" font-size="12.5" font-weight="600" fill="#633806">Root server</text>
<text x="285" y="152" text-anchor="middle" font-size="10.5" fill="#854F0B">knows who</text>
<text x="285" y="166" text-anchor="middle" font-size="10.5" fill="#854F0B">runs .com</text></g>
<g><rect x="226" y="230" width="118" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="285" y="254" text-anchor="middle" font-size="12.5" font-weight="600" fill="#085041">.com TLD server</text>
<text x="285" y="272" text-anchor="middle" font-size="10.5" fill="#0F6E56">knows who</text>
<text x="285" y="286" text-anchor="middle" font-size="10.5" fill="#0F6E56">runs shop.com</text></g>
<g><rect x="226" y="350" width="118" height="70" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="285" y="374" text-anchor="middle" font-size="12.5" font-weight="600" fill="#27500A">Authoritative</text>
<text x="285" y="392" text-anchor="middle" font-size="10.5" fill="#3B6D11">holds the real</text>
<text x="285" y="406" text-anchor="middle" font-size="10.5" fill="#3B6D11">record for shop.com</text></g>
<g font-size="10">
<line x1="136" y1="132" x2="224" y2="132" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<text x="142" y="126" fill="#534AB7">2. shop.com?</text>
<line x1="226" y1="160" x2="138" y2="160" stroke="#5e5d59" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="142" y="174" fill="#854F0B">3. ask .com</text>
<line x1="136" y1="252" x2="224" y2="252" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<text x="142" y="246" fill="#534AB7">4. shop.com?</text>
<line x1="226" y1="280" x2="138" y2="280" stroke="#5e5d59" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="142" y="294" fill="#0F6E56">5. ask ns1</text>
<line x1="136" y1="372" x2="224" y2="372" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<text x="142" y="366" fill="#534AB7">6. shop.com?</text>
<line x1="226" y1="400" x2="138" y2="400" stroke="#5e5d59" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="142" y="414" fill="#3B6D11">7. 203.0.113.10</text>
</g>
<text x="180" y="466" text-anchor="middle" font-size="12" fill="#5e5d59">Solid arrow: a question. Dashed: an answer.</text>
<text x="180" y="484" text-anchor="middle" font-size="12" fill="#5e5d59">Every answer is cached for its TTL,</text>
<text x="180" y="502" text-anchor="middle" font-size="12" fill="#5e5d59">so most lookups stop at step 1 or 2.</text>
</svg>
