<svg xmlns="http://www.w3.org/2000/svg" width="360" height="556" viewBox="0 0 360 556" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>Aggregates: order lines go through JOIN, WHERE and GROUP BY into piles, then one total per pile</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5e5d59"/></marker></defs>
<rect x="1" y="1" width="358" height="554" rx="12" fill="#faf9f5" stroke="#e3e1d9"/>
<text x="16" y="40" font-size="12" font-weight="700" fill="#185FA5">JOIN</text>
<text x="16" y="56" font-size="11" fill="#5e5d59">all lines</text>
<rect x="104" y="24" width="240" height="134" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="116" y="44" font-size="12" font-weight="600" fill="#0C447C">Order lines after the joins</text>
<g font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#185FA5">
<text x="116" y="64">101  Spice Hub   2 x 250 = 500</text>
<text x="116" y="80">101  Spice Hub   1 x 200 = 200</text>
<text x="116" y="96">102  Dosa Den    3 x 120 = 360</text>
<text x="116" y="112" fill="#A32D2D">103  Burger Bay  2 x 180 = 360</text>
<text x="116" y="128">104  Spice Hub   2 x 200 = 400</text>
<text x="116" y="144">105  Spice Hub   1 x 250 = 250</text>
</g>
<line x1="114" y1="108" x2="322" y2="108" stroke="#A32D2D" stroke-width="1.5"/>
<line x1="180" y1="158" x2="180" y2="184" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<text x="16" y="202" font-size="12" font-weight="700" fill="#854F0B">WHERE</text>
<text x="16" y="218" font-size="11" fill="#5e5d59">rows</text>
<rect x="104" y="184" width="240" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="116" y="202" font-size="12" font-weight="600" fill="#633806">Keep delivered lines only</text>
<text x="116" y="220" font-size="11" fill="#A32D2D">103 is cancelled: removed here</text>
<line x1="180" y1="236" x2="180" y2="262" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<text x="16" y="280" font-size="12" font-weight="700" fill="#534AB7">GROUP BY</text>
<text x="16" y="296" font-size="11" fill="#5e5d59">piles</text>
<rect x="104" y="262" width="240" height="88" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="116" y="280" font-size="12" font-weight="600" fill="#3C3489">Pile: Spice Hub</text>
<rect x="116" y="288" width="50" height="24" rx="4" fill="#ffffff" stroke="#534AB7"/>
<text x="141" y="304" text-anchor="middle" font-size="12" fill="#534AB7">500</text>
<rect x="174" y="288" width="50" height="24" rx="4" fill="#ffffff" stroke="#534AB7"/>
<text x="199" y="304" text-anchor="middle" font-size="12" fill="#534AB7">200</text>
<rect x="232" y="288" width="50" height="24" rx="4" fill="#ffffff" stroke="#534AB7"/>
<text x="257" y="304" text-anchor="middle" font-size="12" fill="#534AB7">400</text>
<rect x="290" y="288" width="50" height="24" rx="4" fill="#ffffff" stroke="#534AB7"/>
<text x="315" y="304" text-anchor="middle" font-size="12" fill="#534AB7">250</text>
<text x="116" y="336" font-size="11" fill="#534AB7">4 lines, one pile</text>
<rect x="104" y="362" width="240" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="116" y="380" font-size="12" font-weight="600" fill="#3C3489">Pile: Dosa Den</text>
<rect x="116" y="388" width="50" height="24" rx="4" fill="#ffffff" stroke="#534AB7"/>
<text x="141" y="404" text-anchor="middle" font-size="12" fill="#534AB7">360</text>
<text x="180" y="404" font-size="11" fill="#534AB7">1 line, one pile</text>
<line x1="180" y1="422" x2="180" y2="446" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<text x="16" y="468" font-size="12" font-weight="700" fill="#3B6D11">SUM</text>
<text x="16" y="484" font-size="11" fill="#5e5d59">totals</text>
<rect x="104" y="446" width="240" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="116" y="466" font-size="13" font-weight="600" fill="#27500A">Spice Hub: 1350</text>
<text x="116" y="488" font-size="13" font-weight="600" fill="#27500A">Dosa Den: 360</text>
<text x="180" y="530" text-anchor="middle" font-size="11" fill="#5e5d59">Burger Bay has no pile: its line was removed.</text>
</svg>
