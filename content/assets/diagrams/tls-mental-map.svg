<svg xmlns="http://www.w3.org/2000/svg" width="360" height="572" viewBox="0 0 360 572" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>TLS mental map</title>
<rect x="1" y="1" width="358" height="570" rx="12" fill="#faf9f5" stroke="#e3e1d9"/>
<rect x="120" y="16" width="120" height="40" rx="20" fill="#185FA5"/>
<text x="180" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">TLS</text>
<path d="M120 36 H36 V504" stroke="#b4b2a9" stroke-width="2" fill="none"/>
<g font-size="12">
<path d="M36 110 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="72" width="288" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="68" y="90" font-weight="600" fill="#3C3489">What TLS gives</text>
<text x="68" y="107" fill="#534AB7">Encryption: others cannot read it</text>
<text x="68" y="123" fill="#534AB7">Integrity: changes are detected</text>
<text x="68" y="139" fill="#534AB7">Identity: the server proves its name</text>
<path d="M36 192 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="162" width="288" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="68" y="180" font-weight="600" fill="#0C447C">Two kinds of keys</text>
<text x="68" y="197" fill="#185FA5">Asymmetric: slow, agrees the secret</text>
<text x="68" y="213" fill="#185FA5">Symmetric: fast, locks the data</text>
<path d="M36 266 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="236" width="288" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="68" y="254" font-weight="600" fill="#633806">Handshake</text>
<text x="68" y="271" fill="#854F0B">TLS 1.3: 1 round trip after TCP</text>
<text x="68" y="287" fill="#854F0B">TLS 1.2: 2 round trips</text>
<path d="M36 348 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="310" width="288" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="68" y="328" font-weight="600" fill="#085041">Certificates</text>
<text x="68" y="345" fill="#0F6E56">Signed by a CA</text>
<text x="68" y="361" fill="#0F6E56">Chain: leaf, intermediate, root</text>
<text x="68" y="377" fill="#0F6E56">Root must be in the root store</text>
<path d="M36 430 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="400" width="288" height="60" rx="8" fill="#FCEBEB" stroke="#A32D2D"/>
<text x="68" y="418" font-weight="600" fill="#791F1F">What an attacker sees</text>
<text x="68" y="435" fill="#A32D2D">IP address and domain (SNI)</text>
<text x="68" y="451" fill="#A32D2D">Sizes and timing, not the path</text>
<path d="M36 504 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="474" width="288" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="68" y="492" font-weight="600" fill="#27500A">Man-in-the-middle</text>
<text x="68" y="509" fill="#3B6D11">Stopped by the certificate check</text>
<text x="68" y="525" fill="#3B6D11">HSTS: always use HTTPS</text>
</g>
<text x="180" y="560" text-anchor="middle" font-size="11" fill="#8a8984">Encrypt, verify, then send HTTP</text>
</svg>