<svg xmlns="http://www.w3.org/2000/svg" width="360" height="588" viewBox="0 0 360 588" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>Caching with Redis mental map</title>
<rect x="1" y="1" width="358" height="586" rx="12" fill="#faf9f5" stroke="#e3e1d9"/>
<rect x="83" y="16" width="194" height="40" rx="20" fill="#185FA5"/>
<text x="180" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Caching with Redis</text>
<path d="M83 36 H36 V512" stroke="#b4b2a9" stroke-width="2" fill="none"/>
<g font-size="12">
<path d="M36 110 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="72" width="288" height="76" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="68" y="90" font-weight="600" fill="#0C447C">Redis basics</text>
<text x="68" y="107" fill="#185FA5">In memory, shared by all server instances</text>
<text x="68" y="123" fill="#185FA5">Commands run one at a time (atomic)</text>
<text x="68" y="139" fill="#185FA5">EX seconds, PX milliseconds</text>
<path d="M36 192 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="162" width="288" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="68" y="180" font-weight="600" fill="#3C3489">Cache-aside vs write-through</text>
<text x="68" y="197" fill="#534AB7">Aside: miss reads Postgres, write then DEL</text>
<text x="68" y="213" fill="#534AB7">Write-through: write DB, then SET new value</text>
<path d="M36 274 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="236" width="288" height="76" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="68" y="254" font-weight="600" fill="#633806">TTL and jitter</text>
<text x="68" y="271" fill="#854F0B">TTL: timer that deletes the key</text>
<text x="68" y="287" fill="#854F0B">Caps how stale a copy can get</text>
<text x="68" y="303" fill="#854F0B">Jitter spreads expiry, never delays reads</text>
<path d="M36 356 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="326" width="288" height="60" rx="8" fill="#FCEBEB" stroke="#A32D2D"/>
<text x="68" y="344" font-weight="600" fill="#791F1F">Invalidation</text>
<text x="68" y="361" fill="#A32D2D">DEL after the commit, never before</text>
<text x="68" y="377" fill="#A32D2D">Else stale repopulation until TTL ends</text>
<path d="M36 430 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="400" width="288" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="68" y="418" font-weight="600" fill="#27500A">Cache stampede</text>
<text x="68" y="435" fill="#3B6D11">One hot key expires, many misses at once</text>
<text x="68" y="451" fill="#3B6D11">Fix: SET NX EX lock, one request rebuilds</text>
<path d="M36 512 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="474" width="288" height="76" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="68" y="492" font-weight="600" fill="#2C2C2A">Common mistakes</text>
<text x="68" y="509" fill="#5F5E5A">TTL caps staleness; it does not cause it</text>
<text x="68" y="525" fill="#5F5E5A">Jitter never delays a read</text>
<text x="68" y="541" fill="#5F5E5A">Forgetting the read path (GET, SET)</text>
</g>
<text x="180" y="576" text-anchor="middle" font-size="11" fill="#8a8984">Cache-aside by default; TTL is the backstop</text>
</svg>