<svg xmlns="http://www.w3.org/2000/svg" width="360" height="430" viewBox="0 0 360 430" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>Preflight: the browser asks with OPTIONS first, then sends the real request</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5e5d59"/></marker></defs>
<rect x="1" y="1" width="358" height="428" rx="12" fill="#faf9f5" stroke="#e3e1d9"/>
<rect x="16" y="16" width="120" height="36" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="76" y="39" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">Browser</text>
<rect x="224" y="16" width="120" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="284" y="39" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">Server api.com</text>
<text x="180" y="76" text-anchor="middle" font-size="11.5" font-weight="600" fill="#A32D2D">Step 1 · the preflight (automatic)</text>
<line x1="76" y1="90" x2="282" y2="90" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#a)"/>
<g font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#A32D2D">
<text x="22" y="106">OPTIONS /cart</text>
<text x="22" y="120">Origin: https://shop.com</text>
<text x="22" y="134">Access-Control-Request-Method: PUT</text>
<text x="22" y="148">Access-Control-Request-Headers: content-type</text></g>
<line x1="284" y1="166" x2="78" y2="166" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#a)"/>
<g font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#0F6E56">
<text x="22" y="182">204 No Content</text>
<text x="22" y="196">Access-Control-Allow-Origin: https://shop.com</text>
<text x="22" y="210">Access-Control-Allow-Methods: PUT</text>
<text x="22" y="224">Access-Control-Allow-Headers: content-type</text>
<text x="22" y="238">Access-Control-Max-Age: 600</text></g>
<text x="180" y="266" text-anchor="middle" font-size="11.5" font-weight="600" fill="#185FA5">Step 2 · only if allowed: the real request</text>
<line x1="76" y1="280" x2="282" y2="280" stroke="#185FA5" stroke-width="1.5" marker-end="url(#a)"/>
<g font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#185FA5">
<text x="22" y="296">PUT /cart   {"item": 42}</text></g>
<line x1="284" y1="312" x2="78" y2="312" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#a)"/>
<g font-family="ui-monospace,Menlo,monospace" font-size="10" fill="#0F6E56">
<text x="22" y="328">200 OK</text>
<text x="22" y="342">Access-Control-Allow-Origin: https://shop.com</text></g>
<text x="180" y="374" text-anchor="middle" font-size="12" fill="#5e5d59">If step 1 fails, step 2 is never sent.</text>
<text x="180" y="392" text-anchor="middle" font-size="12" fill="#5e5d59">Max-Age lets the browser skip step 1</text>
<text x="180" y="408" text-anchor="middle" font-size="12" fill="#5e5d59">for the next 600 seconds.</text>
</svg>
