<svg xmlns="http://www.w3.org/2000/svg" width="360" height="540" viewBox="0 0 360 540" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>Race conditions mental map</title>
<rect x="1" y="1" width="358" height="538" rx="12" fill="#faf9f5" stroke="#e3e1d9"/>
<rect x="98" y="16" width="164" height="40" rx="20" fill="#185FA5"/>
<text x="180" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Race conditions</text>
<path d="M98 36 H36 V472" stroke="#b4b2a9" stroke-width="2" fill="none"/>
<g font-size="12">
<path d="M36 102 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="72" width="288" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="68" y="90" font-weight="600" fill="#3C3489">Two shapes</text>
<text x="68" y="107" fill="#534AB7">Lost update: read, add one, write back</text>
<text x="68" y="123" fill="#534AB7">Check-then-act: check, gap, then write</text>
<path d="M36 176 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="146" width="288" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="68" y="164" font-weight="600" fill="#085041">Lost update fix</text>
<text x="68" y="181" fill="#0F6E56">INCR, or one UPDATE ... SET n = n + 1</text>
<text x="68" y="197" fill="#0F6E56">Lua script: several commands, one step</text>
<path d="M36 250 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="220" width="288" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="68" y="238" font-weight="600" fill="#27500A">Verify: SAFE</text>
<text x="68" y="255" fill="#3B6D11">SELECT ... FOR UPDATE in a transaction</text>
<text x="68" y="271" fill="#3B6D11">Row lock lasts until COMMIT; guesses queue</text>
<path d="M36 324 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="294" width="288" height="60" rx="8" fill="#FCEBEB" stroke="#A32D2D"/>
<text x="68" y="312" font-weight="600" fill="#791F1F">Resend: UNSAFE</text>
<text x="68" y="329" fill="#A32D2D">Read last_sent_at, then upsert, no lock</text>
<text x="68" y="345" fill="#A32D2D">Two clicks both pass: two emails</text>
<path d="M36 398 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="368" width="288" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="68" y="386" font-weight="600" fill="#0C447C">Fixes</text>
<text x="68" y="403" fill="#185FA5">SET key 1 NX EX 60: only one gets OK</text>
<text x="68" y="419" fill="#185FA5">Conditional upsert: ON CONFLICT ... WHERE</text>
<path d="M36 472 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="442" width="288" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="68" y="460" font-weight="600" fill="#633806">Logic gap (not a race)</text>
<text x="68" y="477" fill="#854F0B">Resend resets failed_attempts to 0</text>
<text x="68" y="493" fill="#854F0B">5 guesses a minute: about 0.7% a day</text>
</g>
<text x="180" y="528" text-anchor="middle" font-size="11" fill="#8a8984">Check and write must be one atomic step</text>
</svg>