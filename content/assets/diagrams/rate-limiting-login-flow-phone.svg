<svg xmlns="http://www.w3.org/2000/svg" width="360" height="550" viewBox="0 0 360 550" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>Login rate limit: email, normalise, HMAC, Redis limiter, then 429 or the password check</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5e5d59"/></marker></defs>
<rect x="1" y="1" width="358" height="548" rx="12" fill="#faf9f5" stroke="#e3e1d9"/>
<text x="180" y="28" text-anchor="middle" font-size="12" fill="#5e5d59">Every login attempt takes this path</text>

<rect x="40" y="40" width="280" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="52" y="62" font-size="14" font-weight="600" fill="#0C447C">1. Email and password arrive</text>
<text x="52" y="80" font-size="12" fill="#185FA5">sent from the login form</text>
<line x1="180" y1="96" x2="180" y2="116" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="40" y="116" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="52" y="138" font-size="14" font-weight="600" fill="#3C3489">2. Normalise the email</text>
<text x="52" y="156" font-size="12" fill="#534AB7">Ann@Shop.com becomes ann@shop.com</text>
<line x1="180" y1="172" x2="180" y2="192" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="40" y="192" width="280" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="52" y="214" font-size="14" font-weight="600" fill="#633806">3. HMAC-SHA256 with a secret</text>
<text x="52" y="232" font-size="12" fill="#854F0B">one-way: the email cannot be recovered</text>
<line x1="180" y1="248" x2="180" y2="268" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="40" y="268" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="52" y="290" font-size="14" font-weight="600" fill="#085041">4. Limiter in Redis (shared)</text>
<text x="52" y="308" font-size="12" fill="#0F6E56">sliding window: at most 5 per 30 min</text>
<line x1="180" y1="324" x2="180" y2="344" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="40" y="344" width="280" height="40" rx="8" fill="#ffffff" stroke="#854F0B" stroke-width="1.5"/>
<text x="180" y="369" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">5. Under the limit?</text>
<line x1="120" y1="384" x2="120" y2="410" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="240" y1="384" x2="240" y2="410" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#a)"/>
<text x="112" y="400" text-anchor="end" font-size="12" font-weight="600" fill="#3B6D11">yes</text>
<text x="248" y="400" font-size="12" font-weight="600" fill="#A32D2D">no</text>

<rect x="16" y="410" width="150" height="72" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="28" y="432" font-size="13" font-weight="600" fill="#27500A">6. Password check</text>
<text x="28" y="450" font-size="12" fill="#3B6D11">look up the user</text>
<text x="28" y="466" font-size="12" fill="#3B6D11">compare the hash</text>

<rect x="194" y="410" width="150" height="72" rx="8" fill="#FCEBEB" stroke="#A32D2D"/>
<text x="206" y="432" font-size="13" font-weight="600" fill="#791F1F">429 Too Many</text>
<text x="206" y="450" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#A32D2D">Retry-After: 1800</text>
<text x="206" y="466" font-size="11" fill="#A32D2D">DB and hash skipped</text>

<text x="180" y="510" text-anchor="middle" font-size="12" fill="#5e5d59">Blocked attempts never reach the database.</text>
<text x="180" y="528" text-anchor="middle" font-size="12" fill="#5e5d59">Counters live in Redis, so every server agrees.</text>
</svg>
