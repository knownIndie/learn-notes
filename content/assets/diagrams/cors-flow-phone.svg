<svg xmlns="http://www.w3.org/2000/svg" width="360" height="520" viewBox="0 0 360 520" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>CORS: the request goes out, the browser checks the reply before the page may read it</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5e5d59"/></marker></defs>
<rect x="1" y="1" width="358" height="518" rx="12" fill="#faf9f5" stroke="#e3e1d9"/>
<g><rect x="40" y="18" width="280" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="180" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Page on https://shop.com</text>
<text x="180" y="58" text-anchor="middle" font-size="12" fill="#185FA5">its JavaScript calls fetch(...)</text></g>
<line x1="180" y1="70" x2="180" y2="98" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<text x="190" y="88" font-size="11" fill="#5e5d59">1. fetch("https://api.com/cart")</text>
<g><rect x="40" y="100" width="280" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="180" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Browser</text>
<text x="180" y="140" text-anchor="middle" font-size="12" fill="#534AB7" font-family="ui-monospace,Menlo,monospace">adds  Origin: https://shop.com</text></g>
<line x1="180" y1="152" x2="180" y2="180" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<text x="190" y="170" font-size="11" fill="#5e5d59">2. request is sent (always)</text>
<g><rect x="40" y="182" width="280" height="68" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="180" y="204" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Server api.com</text>
<text x="180" y="221" text-anchor="middle" font-size="12" fill="#0F6E56">runs its code, then replies with</text>
<text x="180" y="239" text-anchor="middle" font-size="11.5" fill="#0F6E56" font-family="ui-monospace,Menlo,monospace">Access-Control-Allow-Origin: ?</text></g>
<line x1="180" y1="250" x2="180" y2="278" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<text x="190" y="268" font-size="11" fill="#5e5d59">3. reply comes back</text>
<g><rect x="40" y="280" width="280" height="62" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="180" y="302" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">Browser checks</text>
<text x="180" y="320" text-anchor="middle" font-size="12" fill="#854F0B">Does Allow-Origin match</text>
<text x="180" y="335" text-anchor="middle" font-size="12" fill="#854F0B">the page's Origin?</text></g>
<line x1="130" y1="342" x2="95" y2="378" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="230" y1="342" x2="265" y2="378" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#a)"/>
<text x="88" y="364" text-anchor="end" font-size="12" font-weight="600" fill="#3B6D11">yes</text>
<text x="272" y="364" font-size="12" font-weight="600" fill="#A32D2D">no / missing</text>
<g><rect x="16" y="380" width="158" height="78" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="95" y="404" text-anchor="middle" font-size="13" font-weight="600" fill="#27500A">Page reads</text>
<text x="95" y="421" text-anchor="middle" font-size="13" font-weight="600" fill="#27500A">the data</text>
<text x="95" y="444" text-anchor="middle" font-size="11" fill="#3B6D11">fetch() resolves</text></g>
<g><rect x="186" y="380" width="158" height="78" rx="8" fill="#FCEBEB" stroke="#A32D2D"/>
<text x="265" y="404" text-anchor="middle" font-size="13" font-weight="600" fill="#791F1F">Page gets an error</text>
<text x="265" y="421" text-anchor="middle" font-size="11" fill="#A32D2D">"blocked by CORS policy"</text>
<text x="265" y="444" text-anchor="middle" font-size="11" fill="#A32D2D">reply is thrown away</text></g>
<text x="180" y="486" text-anchor="middle" font-size="12" fill="#5e5d59">Either way, the server already ran.</text>
<text x="180" y="504" text-anchor="middle" font-size="12" fill="#5e5d59">CORS protects reading, not sending.</text>
</svg>
