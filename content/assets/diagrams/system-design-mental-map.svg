<svg xmlns="http://www.w3.org/2000/svg" width="360" height="572" viewBox="0 0 360 572" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>Backend system design mental map</title>
<rect x="1" y="1" width="358" height="570" rx="12" fill="#faf9f5" stroke="#e3e1d9"/>
<rect x="68" y="16" width="224" height="40" rx="20" fill="#185FA5"/>
<text x="180" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Backend system design</text>
<path d="M68 36 H36 V504" stroke="#b4b2a9" stroke-width="2" fill="none"/>
<g font-size="12">
<path d="M36 102 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="72" width="288" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="68" y="90" font-weight="600" fill="#0C447C">Redis</text>
<text x="68" y="107" fill="#185FA5">In memory, shared by every server</text>
<text x="68" y="123" fill="#185FA5">One command at a time, so each is atomic</text>
<path d="M36 184 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="146" width="288" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="68" y="164" font-weight="600" fill="#085041">Caching</text>
<text x="68" y="181" fill="#0F6E56">Cache-aside: miss reads DB, write then DEL</text>
<text x="68" y="197" fill="#0F6E56">Write-through: write DB, then SET</text>
<text x="68" y="213" fill="#0F6E56">TTL caps staleness; jitter spreads expiry</text>
<path d="M36 266 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="236" width="288" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="68" y="254" font-weight="600" fill="#3C3489">Invalidation and stampede</text>
<text x="68" y="271" fill="#534AB7">DEL after commit, every key with a copy</text>
<text x="68" y="287" fill="#534AB7">One hot key: SET NX EX lock rebuilds once</text>
<path d="M36 348 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="310" width="288" height="76" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="68" y="328" font-weight="600" fill="#633806">Rate limiting</text>
<text x="68" y="345" fill="#854F0B">Fixed window: cheap, 2x burst at the edge</text>
<text x="68" y="361" fill="#854F0B">Sliding window: last N seconds from now</text>
<text x="68" y="377" fill="#854F0B">Token bucket: capacity = burst</text>
<path d="M36 430 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="400" width="288" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="68" y="418" font-weight="600" fill="#27500A">Login limits</text>
<text x="68" y="435" fill="#3B6D11">Per HMAC of email, plus per IP</text>
<text x="68" y="451" fill="#3B6D11">Check before the password; 429 + Retry-After</text>
<path d="M36 504 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="474" width="288" height="60" rx="8" fill="#FCEBEB" stroke="#A32D2D"/>
<text x="68" y="492" font-weight="600" fill="#791F1F">Race conditions</text>
<text x="68" y="509" fill="#A32D2D">Lost update: read, add, write</text>
<text x="68" y="525" fill="#A32D2D">Check-then-act: fix with one atomic step</text>
</g>
<text x="180" y="560" text-anchor="middle" font-size="11" fill="#8a8984">Fast reads, firm limits, one atomic step per check</text>
</svg>