<svg xmlns="http://www.w3.org/2000/svg" width="360" height="510" viewBox="0 0 360 510" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>Origin is scheme, host and port: all three must match for two URLs to be the same origin</title>
<rect x="1" y="1" width="358" height="508" rx="12" fill="#faf9f5" stroke="#e3e1d9"/>
<text x="180" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Origin = scheme + host + port</text>
<rect x="16" y="44" width="328" height="58" rx="8" fill="#F1EFE8" stroke="#e3e1d9"/>
<text x="180" y="80" text-anchor="middle" font-size="14" font-family="ui-monospace,Menlo,monospace"><tspan fill="#185FA5">https://</tspan><tspan fill="#534AB7">shop.com</tspan><tspan fill="#0F6E56">:8443</tspan><tspan fill="#854F0B">/cart</tspan></text>
<path d="M104 102 V112" stroke="#b4b2a9" stroke-width="1.5"/>
<path d="M172 102 V112" stroke="#b4b2a9" stroke-width="1.5"/>
<path d="M226 102 V112" stroke="#b4b2a9" stroke-width="1.5"/>
<path d="M268 102 V112" stroke="#b4b2a9" stroke-width="1.5"/>
<text x="104" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#185FA5">scheme</text>
<text x="172" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#534AB7">host</text>
<text x="226" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#0F6E56">port</text>
<text x="268" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#854F0B">path</text>
<text x="180" y="147" text-anchor="middle" font-size="11" fill="#5e5d59">the path is not part of the origin</text>
<text x="180" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">Same or different?</text>
<g>
<rect x="16" y="190" width="328" height="62" rx="8" fill="#F1EFE8" stroke="#e3e1d9"/>
<text x="30" y="214" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#2C2C2A">https://shop.com/cart</text>
<text x="30" y="236" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#5e5d59">vs https://shop.com/help</text>
<rect x="256" y="202" width="80" height="24" rx="12" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="296" y="218" text-anchor="middle" font-size="11" font-weight="600" fill="#27500A">same</text>
</g>
<g>
<rect x="16" y="262" width="328" height="62" rx="8" fill="#F1EFE8" stroke="#e3e1d9"/>
<text x="30" y="286" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#2C2C2A">https://shop.com</text>
<text x="30" y="308" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#5e5d59">vs http://shop.com</text>
<rect x="256" y="274" width="80" height="24" rx="12" fill="#FCEBEB" stroke="#A32D2D"/>
<text x="296" y="290" text-anchor="middle" font-size="11" font-weight="600" fill="#791F1F">different</text>
</g>
<g>
<rect x="16" y="334" width="328" height="62" rx="8" fill="#F1EFE8" stroke="#e3e1d9"/>
<text x="30" y="358" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#2C2C2A">https://shop.com</text>
<text x="30" y="380" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#5e5d59">vs https://api.shop.com</text>
<rect x="256" y="346" width="80" height="24" rx="12" fill="#FCEBEB" stroke="#A32D2D"/>
<text x="296" y="362" text-anchor="middle" font-size="11" font-weight="600" fill="#791F1F">different</text>
</g>
<g>
<rect x="16" y="406" width="328" height="62" rx="8" fill="#F1EFE8" stroke="#e3e1d9"/>
<text x="30" y="430" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#2C2C2A">https://shop.com</text>
<text x="30" y="452" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#5e5d59">vs https://shop.com:8443</text>
<rect x="256" y="418" width="80" height="24" rx="12" fill="#FCEBEB" stroke="#A32D2D"/>
<text x="296" y="434" text-anchor="middle" font-size="11" font-weight="600" fill="#791F1F">different</text>
</g>
<text x="180" y="494" text-anchor="middle" font-size="12" fill="#5e5d59">Same origin only if all three parts match.</text>
</svg>
