<svg xmlns="http://www.w3.org/2000/svg" width="360" height="548" viewBox="0 0 360 548" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>Three rate limiting algorithms on one timeline: fixed window, sliding window, token bucket</title>
<rect x="1" y="1" width="358" height="546" rx="12" fill="#faf9f5" stroke="#e3e1d9"/>
<text x="180" y="28" text-anchor="middle" font-size="12" fill="#5e5d59">Same clients, same limit: 5 requests per minute</text>

<rect x="16" y="40" width="328" height="124" rx="10" fill="#E6F1FB" stroke="#185FA5"/>
<text x="28" y="62" font-size="14" font-weight="600" fill="#0C447C">1. Fixed window: clock blocks</text>
<rect x="40" y="74" width="144" height="22" rx="4" fill="#ffffff" stroke="#185FA5"/>
<text x="112" y="89" text-anchor="middle" font-size="11" fill="#185FA5">window 12:00</text>
<rect x="184" y="74" width="144" height="22" rx="4" fill="#ffffff" stroke="#185FA5"/>
<text x="256" y="89" text-anchor="middle" font-size="11" fill="#185FA5">window 12:01</text>
<rect x="150" y="102" width="68" height="22" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-dasharray="4 3"/>
<g fill="#3B6D11">
<circle cx="160" cy="113" r="3.5"/><circle cx="164.8" cy="113" r="3.5"/><circle cx="169.6" cy="113" r="3.5"/><circle cx="174.4" cy="113" r="3.5"/><circle cx="179.2" cy="113" r="3.5"/>
<circle cx="184" cy="113" r="3.5"/><circle cx="188.8" cy="113" r="3.5"/><circle cx="193.6" cy="113" r="3.5"/><circle cx="198.4" cy="113" r="3.5"/><circle cx="203.2" cy="113" r="3.5"/>
</g>
<text x="180" y="146" text-anchor="middle" font-size="12" font-weight="600" fill="#A32D2D">10 requests in 18 s: twice the limit</text>

<rect x="16" y="176" width="328" height="128" rx="10" fill="#EEEDFE" stroke="#534AB7"/>
<text x="28" y="198" font-size="14" font-weight="600" fill="#3C3489">2. Sliding window: last 60 s from now</text>
<path d="M59 232 V242 H203 V232" stroke="#534AB7" stroke-width="1.5" fill="none"/>
<text x="203" y="226" text-anchor="middle" font-size="11" font-weight="600" fill="#534AB7">now</text>
<text x="131" y="256" text-anchor="middle" font-size="12" fill="#534AB7">last 60 s, counted back from now</text>
<g fill="#3B6D11">
<circle cx="160" cy="274" r="3.5"/><circle cx="164.8" cy="274" r="3.5"/><circle cx="169.6" cy="274" r="3.5"/><circle cx="174.4" cy="274" r="3.5"/><circle cx="179.2" cy="274" r="3.5"/>
</g>
<g fill="#ffffff" stroke="#A32D2D" stroke-width="1.5">
<circle cx="184" cy="274" r="3.5"/><circle cx="188.8" cy="274" r="3.5"/><circle cx="193.6" cy="274" r="3.5"/><circle cx="198.4" cy="274" r="3.5"/><circle cx="203.2" cy="274" r="3.5"/>
</g>
<text x="180" y="296" text-anchor="middle" font-size="11" fill="#5F5E5A">green: allowed (5)    red: 429 (5)</text>

<rect x="16" y="316" width="328" height="160" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="28" y="338" font-size="14" font-weight="600" fill="#085041">3. Token bucket: size and refill</text>
<text x="28" y="356" font-size="11" fill="#0F6E56">size 10 = biggest burst, 1 token/s = average</text>
<line x1="40" y1="366" x2="328" y2="366" stroke="#0F6E56" stroke-opacity="0.35" stroke-dasharray="3 3"/>
<line x1="40" y1="416" x2="328" y2="416" stroke="#5F5E5A"/>
<polyline points="40,366 160,366 160,416 184,366 328,366" fill="none" stroke="#0F6E56" stroke-width="2"/>
<text x="34" y="370" text-anchor="end" font-size="10" fill="#5F5E5A">10</text>
<text x="34" y="420" text-anchor="end" font-size="10" fill="#5F5E5A">0</text>
<text x="152" y="400" text-anchor="end" font-size="11" font-weight="600" fill="#854F0B">10 at 50 s</text>
<text x="262" y="398" text-anchor="middle" font-size="11" fill="#0F6E56">refills 1 per second</text>
<text x="40" y="434" font-size="11" fill="#5F5E5A">0 s</text>
<text x="184" y="434" text-anchor="middle" font-size="11" fill="#5F5E5A">60 s</text>
<text x="328" y="434" text-anchor="end" font-size="11" fill="#5F5E5A">120 s</text>
<text x="180" y="452" text-anchor="middle" font-size="11" fill="#5F5E5A">same time axis for all three panels</text>

<text x="180" y="496" text-anchor="middle" font-size="12" fill="#5e5d59">Fixed: cheap, but can double at the edge.</text>
<text x="180" y="514" text-anchor="middle" font-size="12" fill="#5e5d59">Sliding: no edge reset, so no double burst.</text>
<text x="180" y="532" text-anchor="middle" font-size="12" fill="#5e5d59">Token bucket: allows a burst, keeps the average.</text>
</svg>
