<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" role="img">
<style>:root{
  --font-sans:system-ui,-apple-system,"Segoe UI",sans-serif; --font-mono:ui-monospace,"SF Mono",Menlo,monospace;
  --font-voice:Georgia,serif; --radius:8px;
  --pad-sm:8px; --pad-md:12px; --pad-lg:16px; --pad-xl:24px;
  --gap-xs:4px; --gap-sm:8px; --gap-md:12px; --gap-lg:16px; --gap-xl:24px;
  --p:var(--text-primary); --s:var(--text-secondary); --t:var(--text-muted); --b:var(--border); --bg2:var(--surface-1);

  --text-primary:#1f1e1d; --text-secondary:#5e5d59; --text-muted:#8a8984; --text-disabled:#b4b2a9;
  --text-accent:#185FA5; --text-danger:#A32D2D; --text-success:#3B6D11; --text-warning:#854F0B;
  --bg-accent:#E6F1FB; --bg-danger:#FCEBEB; --bg-success:#EAF3DE; --bg-warning:#FAEEDA;
  --border:rgba(31,30,29,.15); --border-strong:rgba(31,30,29,.3); --border-stronger:rgba(31,30,29,.4);
  --border-accent:#85B7EB; --border-danger:#F09595; --border-success:#97C459; --border-warning:#EF9F27;
  --surface-0:#f5f4ef; --surface-1:#faf9f5; --surface-2:#ffffff; --surface-3:#ffffff;
}
.c-purple>rect,.c-purple>circle,.c-purple>ellipse,.c-purple>polygon, rect.c-purple, circle.c-purple, ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.t,.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect,.c-teal>circle,.c-teal>ellipse,.c-teal>polygon, rect.c-teal, circle.c-teal, ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.t,.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-coral>rect,.c-coral>circle,.c-coral>ellipse,.c-coral>polygon, rect.c-coral, circle.c-coral, ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.t,.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
.c-pink>rect,.c-pink>circle,.c-pink>ellipse,.c-pink>polygon, rect.c-pink, circle.c-pink, ellipse.c-pink{fill:#FBEAF0;stroke:#993556}.c-pink>.t,.c-pink>.th{fill:#72243E}.c-pink>.ts{fill:#993556}
.c-gray>rect,.c-gray>circle,.c-gray>ellipse,.c-gray>polygon, rect.c-gray, circle.c-gray, ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.t,.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
.c-blue>rect,.c-blue>circle,.c-blue>ellipse,.c-blue>polygon, rect.c-blue, circle.c-blue, ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>.t,.c-blue>.th{fill:#0C447C}.c-blue>.ts{fill:#185FA5}
.c-green>rect,.c-green>circle,.c-green>ellipse,.c-green>polygon, rect.c-green, circle.c-green, ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>.t,.c-green>.th{fill:#27500A}.c-green>.ts{fill:#3B6D11}
.c-amber>rect,.c-amber>circle,.c-amber>ellipse,.c-amber>polygon, rect.c-amber, circle.c-amber, ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.t,.c-amber>.th{fill:#633806}.c-amber>.ts{fill:#854F0B}
.c-red>rect,.c-red>circle,.c-red>ellipse,.c-red>polygon, rect.c-red, circle.c-red, ellipse.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red>.t,.c-red>.th{fill:#791F1F}.c-red>.ts{fill:#A32D2D}

.t{font:400 14px var(--font-sans);fill:var(--text-primary)}
.ts{font:400 12px var(--font-sans);fill:var(--text-secondary)}
.th{font:500 14px var(--font-sans);fill:var(--text-primary)}
.box{fill:var(--surface-1);stroke:var(--border-strong)}
.arr{stroke:var(--text-secondary);stroke-width:1.5;fill:none}
.leader{stroke:var(--text-muted);stroke-width:.5;stroke-dasharray:3 3;fill:none}
.node{cursor:default}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
<title>Timeline of page loads: first visit and second visit</title>
<desc>First visit has four bars in a row, DNS, TCP, TLS, HTTP, each 100 ms, totalling 400 ms. Second visit has only the HTTP bar, 100 ms, because the others are saved.</desc>
<text class="th" x="40" y="78" dominant-baseline="central">First visit</text>
<g class="c-purple"><rect x="160" y="60" width="120" height="36" rx="6" stroke-width="0.5"/><text class="th" x="220" y="78" text-anchor="middle" dominant-baseline="central">DNS</text></g>
<g class="c-teal"><rect x="280" y="60" width="120" height="36" rx="6" stroke-width="0.5"/><text class="th" x="340" y="78" text-anchor="middle" dominant-baseline="central">TCP</text></g>
<g class="c-coral"><rect x="400" y="60" width="120" height="36" rx="6" stroke-width="0.5"/><text class="th" x="460" y="78" text-anchor="middle" dominant-baseline="central">TLS</text></g>
<g class="c-pink"><rect x="520" y="60" width="120" height="36" rx="6" stroke-width="0.5"/><text class="th" x="580" y="78" text-anchor="middle" dominant-baseline="central">HTTP</text></g>
<text class="th" x="40" y="148" dominant-baseline="central">Second visit</text>
<g class="c-pink"><rect x="160" y="130" width="120" height="36" rx="6" stroke-width="0.5"/><text class="th" x="220" y="148" text-anchor="middle" dominant-baseline="central">HTTP</text></g>
<text class="ts" x="300" y="148" dominant-baseline="central">DNS, TCP and TLS skipped (saved)</text>
<line x1="160" y1="190" x2="640" y2="190" stroke="var(--t)" stroke-width="0.5"/>
<text class="ts" x="160" y="212" text-anchor="middle">0 ms</text>
<text class="ts" x="280" y="212" text-anchor="middle">100 ms</text>
<text class="ts" x="400" y="212" text-anchor="middle">200 ms</text>
<text class="ts" x="520" y="212" text-anchor="middle">300 ms</text>
<text class="ts" x="640" y="212" text-anchor="middle">400 ms</text>
</svg>