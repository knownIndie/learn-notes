<svg xmlns="http://www.w3.org/2000/svg" width="360" height="688" viewBox="0 0 360 688" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>Networking mental map</title>
<rect x="1" y="1" width="358" height="686" rx="12" fill="#faf9f5" stroke="#e3e1d9"/>
<rect x="105" y="16" width="150" height="40" rx="20" fill="#185FA5"/>
<text x="180" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Networking</text>
<path d="M105 36 H36 V620" stroke="#b4b2a9" stroke-width="2" fill="none"/>
<g font-size="12">
<path d="M36 102 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="72" width="288" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="68" y="90" font-weight="600" fill="#0C447C">HTTP message</text>
<text x="68" y="107" fill="#185FA5">start line, headers, blank line, body</text>
<text x="68" y="123" fill="#185FA5">methods, status codes, stateless</text>
<path d="M36 176 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="146" width="288" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="68" y="164" font-weight="600" fill="#2C2C2A">Request lifecycle</text>
<text x="68" y="181" fill="#5F5E5A">cache, DNS, TCP, TLS, HTTP, render</text>
<text x="68" y="197" fill="#5F5E5A">first visit: about 4 round trips</text>
<path d="M36 250 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="220" width="288" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="68" y="238" font-weight="600" fill="#3C3489">DNS</text>
<text x="68" y="255" fill="#534AB7">name to IP, resolver asks for you</text>
<text x="68" y="271" fill="#534AB7">records A, CNAME, MX; cached by TTL</text>
<path d="M36 324 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="294" width="288" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="68" y="312" font-weight="600" fill="#085041">TCP and UDP</text>
<text x="68" y="329" fill="#0F6E56">TCP: handshake, reliable, in order</text>
<text x="68" y="345" fill="#0F6E56">UDP: no setup, no retries, fast</text>
<path d="M36 398 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="368" width="288" height="60" rx="8" fill="#FCEBEB" stroke="#A32D2D"/>
<text x="68" y="386" font-weight="600" fill="#791F1F">TLS and HTTPS</text>
<text x="68" y="403" fill="#A32D2D">encryption, integrity, identity</text>
<text x="68" y="419" fill="#A32D2D">certificate chain up to a trusted CA</text>
<path d="M36 472 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="442" width="288" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="68" y="460" font-weight="600" fill="#633806">HTTP caching</text>
<text x="68" y="477" fill="#854F0B">Cache-Control max-age: fresh or stale</text>
<text x="68" y="493" fill="#854F0B">ETag + If-None-Match gives 304</text>
<path d="M36 546 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="516" width="288" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<text x="68" y="534" font-weight="600" fill="#27500A">Origin</text>
<text x="68" y="551" fill="#3B6D11">scheme + host + port</text>
<text x="68" y="567" fill="#3B6D11">same-origin policy blocks reading</text>
<path d="M36 620 H56" stroke="#b4b2a9" stroke-width="2"/>
<rect x="56" y="590" width="288" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="68" y="608" font-weight="600" fill="#0C447C">CORS</text>
<text x="68" y="625" fill="#185FA5">server allows other origins to read</text>
<text x="68" y="641" fill="#185FA5">preflight OPTIONS; not CSRF protection</text>
</g>
<text x="180" y="676" text-anchor="middle" font-size="11" fill="#8a8984">Every topic is one step of loading a page</text>
</svg>