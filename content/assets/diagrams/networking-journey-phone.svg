<svg xmlns="http://www.w3.org/2000/svg" width="360" height="602" viewBox="0 0 360 602" role="img" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<title>The request journey: every networking topic is one step of loading a page</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5e5d59"/></marker></defs>
<rect x="1" y="1" width="358" height="600" rx="12" fill="#faf9f5" stroke="#e3e1d9"/>
<rect x="16" y="16" width="328" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<circle cx="38" cy="39" r="11" fill="#5F5E5A"/><text x="38" y="43" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
<text x="58" y="44" font-size="12.5" font-weight="600" fill="#2C2C2A">Type shop.com/cart, press Enter</text>
<line x1="180" y1="62" x2="180" y2="74" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="16" y="76" width="328" height="46" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<circle cx="38" cy="99" r="11" fill="#854F0B"/><text x="38" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
<text x="58" y="95" font-size="12.5" font-weight="600" fill="#633806">Fresh copy in the cache?</text>
<text x="58" y="112" font-size="11" fill="#854F0B">page: HTTP caching</text>
<line x1="180" y1="122" x2="180" y2="134" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="16" y="136" width="328" height="46" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<circle cx="38" cy="159" r="11" fill="#534AB7"/><text x="38" y="163" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
<text x="58" y="155" font-size="12.5" font-weight="600" fill="#3C3489">DNS: name to IP address</text>
<text x="58" y="172" font-size="11" fill="#534AB7">page: DNS</text>
<line x1="180" y1="182" x2="180" y2="194" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="16" y="196" width="328" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<circle cx="38" cy="219" r="11" fill="#0F6E56"/><text x="38" y="223" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
<text x="58" y="215" font-size="12.5" font-weight="600" fill="#085041">TCP: open a reliable connection</text>
<text x="58" y="232" font-size="11" fill="#0F6E56">page: TCP</text>
<line x1="180" y1="242" x2="180" y2="254" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="16" y="256" width="328" height="46" rx="8" fill="#FCEBEB" stroke="#A32D2D"/>
<circle cx="38" cy="279" r="11" fill="#A32D2D"/><text x="38" y="283" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
<text x="58" y="275" font-size="12.5" font-weight="600" fill="#791F1F">TLS: encrypt, check certificate</text>
<text x="58" y="292" font-size="11" fill="#A32D2D">page: TLS</text>
<line x1="180" y1="302" x2="180" y2="314" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="16" y="316" width="328" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<circle cx="38" cy="339" r="11" fill="#185FA5"/><text x="38" y="343" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
<text x="58" y="335" font-size="12.5" font-weight="600" fill="#0C447C">Send the HTTP request</text>
<text x="58" y="352" font-size="11" fill="#185FA5">page: HTTP message</text>
<line x1="180" y1="362" x2="180" y2="374" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="16" y="376" width="328" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<circle cx="38" cy="399" r="11" fill="#185FA5"/><text x="38" y="403" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">7</text>
<text x="58" y="395" font-size="12.5" font-weight="600" fill="#0C447C">Server works, sends the reply</text>
<text x="58" y="412" font-size="11" fill="#185FA5">page: HTTP message</text>
<line x1="180" y1="422" x2="180" y2="434" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="16" y="436" width="328" height="46" rx="8" fill="#EAF3DE" stroke="#3B6D11"/>
<circle cx="38" cy="459" r="11" fill="#3B6D11"/><text x="38" y="463" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">8</text>
<text x="58" y="455" font-size="12.5" font-weight="600" fill="#27500A">Other origin? Browser checks</text>
<text x="58" y="472" font-size="11" fill="#3B6D11">page: Origin, CORS</text>
<line x1="180" y1="482" x2="180" y2="494" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="16" y="496" width="328" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<circle cx="38" cy="519" r="11" fill="#5F5E5A"/><text x="38" y="523" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">9</text>
<text x="58" y="524" font-size="12.5" font-weight="600" fill="#2C2C2A">Page on screen</text>
<text x="180" y="560" text-anchor="middle" font-size="12" fill="#5e5d59">A fresh cache hit skips steps 3 to 7.</text>
<text x="180" y="578" text-anchor="middle" font-size="12" fill="#5e5d59">A reused connection skips steps 3 to 5.</text>
</svg>